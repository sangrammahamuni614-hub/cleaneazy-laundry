<!doctype html>
<html lang="mr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f1">
  <title>पासवर्ड पुनर्स्थापित करा | CleanEazy Laundry</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f1;color:#213128;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px;box-sizing:border-box}
    .reset-card{width:min(100%,440px);background:#fff;border:1px solid #e3e9e2;border-radius:20px;padding:32px;box-shadow:0 18px 55px rgba(35,57,43,.10)}
    .reset-brand{display:flex;align-items:center;gap:10px;color:#213128;text-decoration:none;font-weight:750;margin-bottom:28px}
    .brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#d9f0df;color:#27683d;font-weight:800}
    .reset-card h1{font-size:25px;margin:0 0 10px}
    .reset-card p{line-height:1.55;color:#5d6b62;margin:0 0 20px}
    .reset-card label{display:block;font-size:14px;font-weight:650;margin:16px 0 7px}
    .reset-card input{box-sizing:border-box;width:100%;border:1px solid #cad5cb;border-radius:10px;padding:12px 13px;font:inherit}
    .reset-card input:focus{outline:3px solid rgba(46,123,73,.18);border-color:#39834f}
    .reset-card button{width:100%;margin-top:20px;border:0;border-radius:10px;background:#286a40;color:#fff;padding:13px;font:inherit;font-weight:700;cursor:pointer}
    .reset-card button:disabled{opacity:.6;cursor:wait}
    #notice{min-height:24px;margin-top:14px;font-size:14px}
    #notice[data-kind="error"]{color:#a12b23}
    #notice[data-kind="success"]{color:#286a40}
    .back-login{display:block;text-align:center;margin-top:22px;color:#286a40}
    @media(max-width:480px){.reset-card{padding:24px 20px}}
  </style>
</head>
<body>
  <main class="reset-card">
    <a class="reset-brand" href="./"><span class="brand-mark">C</span><span>CleanEazy Laundry</span></a>
    <section id="request-panel">
      <h1>पासवर्ड विसरलात?</h1>
      <p>तुमच्या खात्याचा ई-मेल द्या. खाते असल्यास पासवर्ड बदलण्याची लिंक पाठवली जाईल.</p>
      <form id="request-form">
        <label for="email">ई-मेल</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <button type="submit">रीसेट लिंक पाठवा</button>
      </form>
    </section>
    <section id="change-panel" hidden>
      <h1>नवीन पासवर्ड ठेवा</h1>
      <p>नवीन पासवर्ड किमान ८ अक्षरांचा ठेवा.</p>
      <form id="change-form">
        <label for="password">नवीन पासवर्ड</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirm-password">पासवर्ड पुन्हा लिहा</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
        <button type="submit">पासवर्ड बदला</button>
      </form>
    </section>
    <p id="notice" role="status" aria-live="polite"></p>
    <a class="back-login" href="./">← लॉगिनकडे परत</a>
  </main>
  <script src="./runtime-config.js"></script>
  <script>
    (function () {
      "use strict";
      const config = window.CLEANEAZY_CONFIG || {};
      const apiBase = config.supabaseUrl ? config.supabaseUrl.replace(/\/$/, "") + "/auth/v1" : "";
      const notice = document.getElementById("notice");
      let recoveryToken = "";
      function setNotice(message, kind) {
        notice.textContent = message;
        notice.dataset.kind = kind || "";
      }
      function errorMessage(payload) {
        return payload && (payload.msg || payload.message || payload.error_description || payload.error) || "";
      }
      function parseFragment() {
        const values = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        recoveryToken = values.get("access_token") || "";
        const type = values.get("type") || "";
        const error = values.get("error_description") || values.get("error") || "";
        if (recoveryToken && type === "recovery") {
          window.history.replaceState({}, "", window.location.pathname + window.location.search);
          document.getElementById("request-panel").hidden = true;
          document.getElementById("change-panel").hidden = false;
          return;
        }
        if (error) setNotice("ही लिंक कालबाह्य किंवा अवैध आहे. नवीन रीसेट लिंक मागवा.", "error");
      }
      document.getElementById("request-form").addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!apiBase || !config.supabaseAnonKey) {
          setNotice("रीसेट सेवा सध्या उपलब्ध नाही. व्यवस्थापकाशी संपर्क करा.", "error");
          return;
        }
        const button = event.currentTarget.querySelector("button");
        button.disabled = true;
        setNotice("विनंती पाठवत आहे…", "");
        try {
          const redirectTo = new URL("./reset-password.html", window.location.href).href;
          const response = await fetch(apiBase + "/recover?redirect_to=" + encodeURIComponent(redirectTo), {
            method: "POST",
            headers: { "apikey": config.supabaseAnonKey, "Content-Type": "application/json" },
            body: JSON.stringify({ email: document.getElementById("email").value.trim() })
          });
          if (!response.ok) {
            let payload = null;
            try { payload = await response.json(); } catch (_) {}
            if (response.status === 429) throw new Error("खूप विनंत्या झाल्या. थोड्या वेळाने पुन्हा प्रयत्न करा.");
            throw new Error(errorMessage(payload) || "रीसेट विनंती पाठवता आली नाही.");
          }
          setNotice("खाते असल्यास रीसेट लिंक ई-मेलवर पाठवली आहे. Inbox आणि spam तपासा.", "success");
        } catch (error) {
          setNotice(error.message || "रीसेट विनंती पाठवता आली नाही.", "error");
        } finally {
          button.disabled = false;
        }
      });
      document.getElementById("change-form").addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!recoveryToken || !apiBase || !config.supabaseAnonKey) {
          setNotice("रीसेट लिंक अवैध किंवा कालबाह्य आहे. नवीन लिंक मागवा.", "error");
          return;
        }
        const password = document.getElementById("password").value;
        const confirmation = document.getElementById("confirm-password").value;
        if (password !== confirmation) {
          setNotice("दोन्ही पासवर्ड जुळत नाहीत.", "error");
          return;
        }
        const button = event.currentTarget.querySelector("button");
        button.disabled = true;
        setNotice("पासवर्ड बदलत आहे…", "");
        try {
          const response = await fetch(apiBase + "/user", {
            method: "PUT",
            headers: {
              "apikey": config.supabaseAnonKey,
              "Authorization": "Bearer " + recoveryToken,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ password: password })
          });
          if (!response.ok) {
            let payload = null;
            try { payload = await response.json(); } catch (_) {}
            throw new Error(errorMessage(payload) || "पासवर्ड बदलता आला नाही. नवीन रीसेट लिंक मागवा.");
          }
          recoveryToken = "";
          event.currentTarget.reset();
          document.getElementById("change-panel").hidden = true;
          setNotice("पासवर्ड बदलला. आता नवीन पासवर्डने लॉगिन करा.", "success");
        } catch (error) {
          setNotice(error.message || "पासवर्ड बदलता आला नाही. नवीन रीसेट लिंक मागवा.", "error");
        } finally {
          button.disabled = false;
        }
      });
      parseFragment();
    })();
  </script>
</body>
</html>
