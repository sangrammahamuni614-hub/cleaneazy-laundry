name: Validate CleanEazy site and app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/site.js
          node --check software/app.js
          node --check software/sw.js
          node --check tools/local-server.cjs
          node --check tools/stop-server.cjs
      - name: Check required pages and PWA files
        run: |
          test -f index.html
          test -f software/index.html
          test -f software/manifest.json
          test -f software/manifest.webmanifest
          test -f software/sw.js
          test -f software/offline.html
          test -f software/icon.svg
          test -f robots.txt
          test -f sitemap.xml
          node -e "JSON.parse(require('fs').readFileSync('software/manifest.json','utf8')); JSON.parse(require('fs').readFileSync('software/manifest.webmanifest','utf8'))"
      - name: Check Marathi UI and private management route
        run: |
          grep -qi 'lang="mr-IN"' software/index.html
          grep -qi 'noindex,nofollow' software/index.html
          grep -qi 'Disallow: /cleaneazy-laundry/software/' robots.txt
          grep -q 'welcome_discount' supabase/migrations/20261007055219_first_order_welcome_offer.sql
          test ! -e manager
          test ! -e admin.html
